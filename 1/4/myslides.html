<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>この2週間の過ごし方</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">

<body>

      </section>

      <!-- 2枚目: やったこと -->
      <section>
        <h2>やったこと</h2>
        <ul>
          <li class="fragment">勉強:ここに内容を書く</li>
          <li class="fragment">趣味・遊び:ここに内容を書く</li>
          <li class="fragment">印象に残ったこと:ここに内容を書く</li>
        </ul>
      </section>

      <!-- 3枚目: 振り返り -->
      <section data-background-color="#2c5282">
        <h2>振り返りとこれから</h2>
        <p>学んだこと:ここに書く</p>
        <p>次にやりたいこと:ここに書く</p>
      </section>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
  <script>
    Reveal.initialize({ hash: true });
  </script>
</body>
</html>
